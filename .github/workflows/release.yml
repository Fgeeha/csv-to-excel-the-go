name: Build and Deploy Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        goos: [linux, darwin, windows]
        goarch: [amd64]
        exclude:
          - os: ubuntu-latest
            goos: darwin
          - os: ubuntu-latest
            goos: windows
          - os: macos-latest
            goos: linux
          - os: macos-latest
            goos: windows
          - os: windows-latest
            goos: linux
          - os: windows-latest
            goos: darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libglfw3-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install gcc
          brew install libpng
          brew install glfw  # Устанавливаем GLFW для OpenGL
          xcode-select --install || true # Устанавливаем Xcode CLI, если не установлено

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install mingw -y
          choco install glfw -y  # Устанавливаем GLFW для Windows
        env:
          CHOCOLATEY_CACHE: "C:\\ProgramData\\chocolatey\\cache"

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Go modules
        run: go mod download

      - name: Build with verbose output
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -v -o csv-to-excel-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} main.go || (echo "Build failed" && exit 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: csv-to-excel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: csv-to-excel-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release body file
        run: |
          echo "Release ${{ github.ref_name }} by ${{ github.event.head_commit.author.name }}" > release_body.md
          echo "" >> release_body.md
          echo "## Changes" >> release_body.md
          echo "Automated build from commit ${{ github.sha }}" >> release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            artifacts/csv-to-excel-linux-amd64/csv-to-excel-linux-amd64
            artifacts/csv-to-excel-darwin-amd64/csv-to-excel-darwin-amd64
            artifacts/csv-to-excel-windows-amd64/csv-to-excel-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}