name: Build and Deploy Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          # Исключаем неподдерживаемые комбинации
          - os: ubuntu-latest
            goos: windows
          - os: ubuntu-latest
            goos: darwin
          - os: windows-latest
            goos: linux
          - os: windows-latest
            goos: darwin
          - os: macos-latest
            goos: linux
          - os: macos-latest
            goos: windows
          # Исключаем arm64 для Windows, так как не поддерживается в текущем окружении
          - os: windows-latest
            goos: windows
            goarch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libglfw3-dev
          # Поддержка разных дистрибутивов обеспечивается через glibc, дополнительные пакеты не требуются

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install mingw -y
        env:
          CHOCOLATEY_CACHE: "C:\\ProgramData\\chocolatey\\cache"

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install gcc
          brew install libpng
          brew install glfw
          xcode-select --install || true # Устанавливаем Xcode CLI

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Go modules
        run: go mod download

      - name: Build with verbose output (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          go build -v -ldflags "-X main.version=${{ github.ref_name }}" -o csv-to-excel-${{ matrix.goos }}-${{ matrix.goarch }}-v${{ github.ref_name }} main.go || (echo "Build failed" && exit 1)
        shell: bash

      - name: Build with verbose output (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          go build -v -ldflags "-H=windowsgui -X main.version=${{ github.ref_name }}" -o csv-to-excel-${{ matrix.goos }}-${{ matrix.goarch }}-v${{ github.ref_name }}.exe main.go
          if ($LASTEXITCODE -ne 0) { Write-Output "Build failed"; exit 1 }
        shell: pwsh

      - name: Build with verbose output (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          go build -v -ldflags "-X main.version=${{ github.ref_name }}" -o csv-to-excel-${{ matrix.goos }}-${{ matrix.goarch }}-v${{ github.ref_name }} main.go || (echo "Build failed" && exit 1)
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: csv-to-excel-${{ matrix.goos }}-${{ matrix.goarch }}-v${{ github.ref_name }}
          path: csv-to-excel-${{ matrix.goos }}-${{ matrix.goarch }}-v${{ github.ref_name }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release body file
        run: |
          echo "Release ${{ github.ref_name }} by ${{ github.event.head_commit.author.name }}" > release_body.md
          echo "" >> release_body.md
          echo "## Changes" >> release_body.md
          echo "Automated build from commit ${{ github.sha }}" >> release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            artifacts/csv-to-excel-linux-amd64-v${{ github.ref_name }}/csv-to-excel-linux-amd64-v${{ github.ref_name }}
            artifacts/csv-to-excel-linux-arm64-v${{ github.ref_name }}/csv-to-excel-linux-arm64-v${{ github.ref_name }}
            artifacts/csv-to-excel-windows-amd64-v${{ github.ref_name }}/csv-to-excel-windows-amd64-v${{ github.ref_name }}.exe
            artifacts/csv-to-excel-darwin-amd64-v${{ github.ref_name }}/csv-to-excel-darwin-amd64-v${{ github.ref_name }}
            artifacts/csv-to-excel-darwin-arm64-v${{ github.ref_name }}/csv-to-excel-darwin-arm64-v${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}