name: Build and Deploy Binaries

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.png'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.png'

jobs:
  get_previous_tag:
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.get_previous_tag_step.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get previous tag
        id: get_previous_tag_step
        run: echo "previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0')" >> "$GITHUB_OUTPUT"

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        goos: [linux, darwin, windows]
        goarch: [amd64]
        exclude:
          - os: ubuntu-latest
            goos: darwin
          - os: ubuntu-latest
            goos: windows
          - os: macos-latest
            goos: linux
          - os: macos-latest
            goos: windows
          - os: windows-latest
            goos: linux
          - os: windows-latest
            goos: darwin

    runs-on: ${{ matrix.os }}
    needs: get_previous_tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o csv-to-excel-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: csv-to-excel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: csv-to-excel-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release body file
        run: |
          echo "Release v1.0.${{ github.run_number }} by ${{ github.event.head_commit.author.name }}" > release_body.md
          echo "" >> release_body.md
          echo "## Changes" >> release_body.md
          echo "Automated build from commit ${{ github.sha }}" >> release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v1.0.${{ github.run_number }}
          tag_name: v1.0.${{ github.run_number }}
          body_path: release_body.md
          files: |
            artifacts/csv-to-excel-linux-amd64/csv-to-excel-linux-amd64
            artifacts/csv-to-excel-darwin-amd64/csv-to-excel-darwin-amd64
            artifacts/csv-to-excel-windows-amd64/csv-to-excel-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}